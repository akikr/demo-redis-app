services:
  redis-master:
    image: redis:8-alpine
    container_name: redis-master
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --save 300 10 \
          --requirepass "$${REDIS_PASSWORD}" \
          --masterauth "$${REDIS_PASSWORD}" \
          --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-replica-1:
    image: redis:8-alpine
    container_name: redis-replica-1
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --save 300 10 \
          --replicaof redis-master 6379 \
          --requirepass "$${REDIS_PASSWORD}" \
          --masterauth "$${REDIS_PASSWORD}" \
          --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis_replica_1_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  redis-replica-2:
    image: redis:8-alpine
    container_name: redis-replica-2
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --save 300 10 \
          --replicaof redis-master 6379 \
          --requirepass "$${REDIS_PASSWORD}" \
          --masterauth "$${REDIS_PASSWORD}" \
          --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis_replica_2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:8-alpine
    container_name: redis-sentinel-1
    command:
      - sh
      - -c
      - |
        cat >/tmp/sentinel.conf <<EOF
        port 26379
        bind 0.0.0.0
        sentinel monitor mymaster redis-master 6379 2
        sentinel auth-pass mymaster $${REDIS_PASSWORD}
        sentinel down-after-milliseconds mymaster 10000
        sentinel failover-timeout mymaster 180000
        sentinel parallel-syncs mymaster 1
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        EOF
        exec redis-server /tmp/sentinel.conf --sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  redis-sentinel-2:
    image: redis:8-alpine
    container_name: redis-sentinel-2
    command:
      - sh
      - -c
      - |
        cat >/tmp/sentinel.conf <<EOF
        port 26379
        bind 0.0.0.0
        sentinel monitor mymaster redis-master 6379 2
        sentinel auth-pass mymaster $${REDIS_PASSWORD}
        sentinel down-after-milliseconds mymaster 10000
        sentinel failover-timeout mymaster 180000
        sentinel parallel-syncs mymaster 1
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        EOF
        exec redis-server /tmp/sentinel.conf --sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:8-alpine
    container_name: redis-sentinel-3
    command:
      - sh
      - -c
      - |
        cat >/tmp/sentinel.conf <<EOF
        port 26379
        bind 0.0.0.0
        sentinel monitor mymaster redis-master 6379 2
        sentinel auth-pass mymaster $${REDIS_PASSWORD}
        sentinel down-after-milliseconds mymaster 10000
        sentinel failover-timeout mymaster 180000
        sentinel parallel-syncs mymaster 1
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        EOF
        exec redis-server /tmp/sentinel.conf --sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  demo-app:
    image: app/redis-app-sb:v1
    container_name: demo-app
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      JAVA_TOOL_OPTIONS: -Xmx300m
    command:
      - --spring.profiles.active=prod
      - --app.redis-cache.default-ttl-value=10000
      - --app.redis-cache.correlation-store-ttl-value=20000
      # This timeout value must be greater that TTL values (default-ttl-value OR correlation-store-ttl-value)
      - --spring.data.redis.timeout=30s
      - --spring.data.redis.password=$${REDIS_PASSWORD}
      - --spring.data.redis.sentinel.master=mymaster
      - --spring.data.redis.sentinel.nodes=$${REDIS_SENTINEL_NODES}
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8090 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_master_data:
  redis_replica_1_data:
  redis_replica_2_data:
