## Server config
server.port=8090
server.servlet.context-path=/app

## Spring config
spring.application.name=redis-app-test

# Redis default cache TTL for the app in (milliseconds)
app.redis-cache.default-ttl-value=3000
# App correlation-store redis-data TTL in (milliseconds)
app.redis-cache.correlation-store-ttl-value=5000
